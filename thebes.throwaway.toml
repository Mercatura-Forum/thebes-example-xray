[project]
name = "xray-throwaway"
default_network = "wan"
chain_id = 2026

[networks.wan]
# One stable public name resolves the whole validator set behind the
# boundary — never put validator IPs here.
gateway = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.xray]
type = "backend-motoko"
cid = 64841135246282
wasm = "build/xray.wasm"
build = 'cd motoko && mops install >/dev/null 2>&1 && mkdir -p ../build && MOC="$(ls "$HOME/.cache/mops/moc/1.4.1/moc" "$HOME/Library/Caches/mops/moc/1.4.1/moc" 2>/dev/null | head -1)" && "$MOC" $(mops sources) -o ../build/xray.wasm main.mo'
